name: Deploy Concierge API

on:
  push:
    branches: [main]
    paths:
      - "workers/concierge/**"
      - ".github/workflows/deploy-concierge-api.yml"
      - "public/velanera-app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: concierge-api
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Require secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          missing=0
          [ -n "$OPENAI_API_KEY" ] || { echo "::error::Missing secret OPENAI_API_KEY"; missing=1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Missing secret CLOUDFLARE_API_TOKEN"; missing=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Create the missing secrets in GitHub → Settings → Secrets and variables → Actions → Secrets"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Cloudflare Worker with OPENAI_API_KEY secret
        id: deploy
        working-directory: workers/concierge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # Bind OPENAI_API_KEY into the Worker environment (secret — never logged)
          printf '%s' "$OPENAI_API_KEY" | npx --yes wrangler@4 secret put OPENAI_API_KEY

          # Deploy worker code + vars (model, CORS). Secret remains env binding.
          DEPLOY_LOG="$(mktemp)"
          npx --yes wrangler@4 deploy 2>&1 | tee "$DEPLOY_LOG"

          WORKER_URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$DEPLOY_LOG" | head -n1 || true)"
          if [ -z "$WORKER_URL" ]; then
            echo "::error::Could not parse workers.dev URL from wrangler deploy output"
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "Worker URL: $WORKER_URL"

      - name: Verify GET /health
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          BODY="$(curl -fsS "$WORKER_URL/health")"
          echo "$BODY"
          echo "$BODY" | grep -q '"status":"ok"' || echo "$BODY" | grep -q '"status": "ok"'
          echo "Health check passed"

      - name: Verify POST /chat (GPT-5.5)
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          BODY="$(curl -fsS -X POST "$WORKER_URL/chat" \
            -H 'Content-Type: application/json' \
            -d '{"transcript":"Say hello in one short sentence as the Velanera host."}')"
          echo "$BODY"
          echo "$BODY" | grep -q '"reply"'
          echo "$BODY" | grep -q '"model"'
          echo "$BODY" | grep -q 'gpt-5.5'
          echo "Chat check passed"

  deploy-pages:
    needs: deploy-worker
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inject Concierge worker URL (remove demo mode)
        env:
          CONCIERGE_API_BASE: ${{ needs.deploy-worker.outputs.worker_url }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = String(process.env.CONCIERGE_API_BASE || '').replace(/\/$/, '');
          if (!base) {
            console.error('Missing worker URL');
            process.exit(1);
          }
          const body = `/** Generated by Deploy Concierge API — do not hardcode keys. */\nwindow.VELANERA_CONFIG = {\n  conciergeApiBase: ${JSON.stringify(base)},\n};\n`;
          fs.writeFileSync('public/velanera-app/config.js', body);
          console.log('Concierge API base:', base);
          NODE
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
