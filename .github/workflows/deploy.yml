name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Point Concierge prototype at OpenAI worker
        env:
          CONCIERGE_API_BASE: ${{ vars.CONCIERGE_API_BASE }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = String(process.env.CONCIERGE_API_BASE || '').replace(/\/$/, '');
          const body = `/** Generated by deploy.yml — do not edit by hand on CI. */\nwindow.VELANERA_CONFIG = {\n  conciergeApiBase: ${JSON.stringify(base)},\n};\n`;
          fs.writeFileSync('public/velanera-app/config.js', body);
          if (!base) {
            console.log('Concierge API base: (empty — demo/mock mode). Set Actions variable CONCIERGE_API_BASE after deploying workers/concierge.');
          } else {
            console.log('Concierge API base:', base);
          }
          NODE
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
