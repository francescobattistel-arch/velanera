name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-beta-*"

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build & upload
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios/Velanera
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      VELANERA_BUNDLE_ID: co.velanera.app
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      MATCH_READONLY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify required secrets
        run: |
          missing=0
          for key in APPLE_TEAM_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "Missing secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets listed in ios/Velanera/TESTFLIGHT.md, then re-run."
            exit 1
          fi

      - name: Install Fastlane
        run: brew install fastlane

      - name: Build and upload to TestFlight
        run: fastlane beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velanera-ipa
          path: ios/Velanera/build/*.ipa
          if-no-files-found: ignore
