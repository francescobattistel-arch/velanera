name = "velanera-concierge"
main = "src/worker.js"
compatibility_date = "2026-07-01"

# OPENAI_API_KEY is a Worker secret (never commit, never put in [vars]):
#   set from GitHub Actions: printf '%s' "$OPENAI_API_KEY" | wrangler secret put OPENAI_API_KEY

[vars]
OPENAI_MODEL = "gpt-5.5"
ALLOWED_ORIGINS = "https://velanera.co,https://www.velanera.co,https://francescobattistel-arch.github.io,http://localhost:5173,http://127.0.0.1:5173"
